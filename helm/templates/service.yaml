apiVersion: v1
kind: Service
metadata:
  name: {{ include "cd-demo.fullname" . }}
  labels:
    {{- include "cd-demo.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.metrics.port | default 9090 }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "cd-demo.selectorLabels" . | nindent 4 }}
